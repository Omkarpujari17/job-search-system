name: Daily Job Update

on:
  schedule:
    - cron: "0 3 * * *"   # Daily at 08:30 AM IST
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # -----------------------------
      # Set up Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          pip install pandas requests

      # -----------------------------
      # Fetch Greenhouse jobs
      # -----------------------------
      - name: Fetch Greenhouse jobs
        run: python greenhouse_fetcher.py

      # -----------------------------
      # Fetch Lever jobs
      # -----------------------------
      - name: Fetch Lever jobs
        run: python lever_fetcher.py

      # -----------------------------
      # Merge jobs
      # -----------------------------
      - name: Merge jobs
        run: python merge_jobs.py

      # -----------------------------
      # Commit & push updated CSVs
      # -----------------------------
            - name: Commit updated job files
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@github.com"

          git fetch origin main
          git rebase origin/main || git rebase --abort

          git add greenhouse.csv lever.csv all_jobs.csv
          git commit -m "Daily job update" || echo "No changes to commit"

          git push origin main

